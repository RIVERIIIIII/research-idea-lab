DC_template: &DC_template
  type: Data_Center
  id: 1000
  name: DC0
  server_num: 1000
  server:
    GPU_num: 8
    GPU_type: NVIDIA_A100
    storage:
      type: SSD
      capacity_GiB: 8000
      free_GiB: 8000
      bandwidth_GiBps: 8
    memory:
      type: DDR4
      capacity_GiBps: 32
      free_GiBps: 32
      bandwidth_GiBps: 8
  network:
    type: NVLink
    topology: HPN
    bw_intra: 1.8  # 机内带宽 (TB/s)
    bw_inter: 0.1  # 机间带宽 (TB/s)
  co_location_node: 0
  # 背景任务配置
  background_tasks:
    enabled: true  # 是否启用背景任务
    gpu_utilization:
      min_ratio: 0.2  # GPU最小占用比例
      max_ratio: 0.5  # GPU最大占用比例
    random_seed: 42  # 随机种子，确保多次运行占用一致


# --- 数据中心950-1000（ROADM/OXC+OTN交换机）---
