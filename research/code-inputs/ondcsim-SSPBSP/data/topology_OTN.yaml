# ODU0模板定义
odu0_template: &odu0_template
  odu0_id: 0
  bandwidth: 1.25G
  status: 0           # ODU0状态：0-未占用，1-已占用
  fg_otn_slots:       # fgOTN时隙配置
    total_slots: 119     # 每个ODU0支持119个fgOTN时隙
    available_slots: 119 # 可用fgOTN时隙数
    occupied_slots: 0    # 已占用fgOTN时隙数
  consistency_id: 0      # ODU0一致性标识，用于保证ODU0在链路上的一致性
  support_fg_otn: true   # 是否支持fgOTN（仅接入和汇聚网节点支持）

# 100G波长通道模板
wavelength_100g_template: &wavelength_100g_template
  wavelength_id: 0
  bandwidth: 100G
  status: 0           #波长状态，默认可用,占用情况：0-未占用，1-已占用
  consistency_id: 0      # 波长一致性标识，用于保证波长在链路上的一致性
  odu0_list:             # 示例：id=1的ODU0配置
    - odu0_id: 1
      <<: *odu0_template

# 400G波长通道模板
wavelength_400g_template: &wavelength_400g_template
  wavelength_id: 0
  bandwidth: 400G
  status: 0          #波长状态，默认可用
  consistency_id: 0      # 波长一致性标识
  odu0_list:             # 示例：id=1的ODU0配置
    - odu0_id: 1
      <<: *odu0_template

# 接入网链路模板
link_access_template: &link_access_template
  id: 2000
  src: 0
  dst: 0
  type: access       # 链路类型：access（接入网）、aggregation（汇聚网）、core（省干传输）
  length_km: 0
  attenuation: 0.22
  dispersion: 17
  osnr: 35                      #dB
  total_wavelengths: 40         # 光纤总波长容量
  fg_otn_support: true          # 支持fgOTN
  oduk_support: true            # 支持ODUk
  wavelength_support: true      # 支持波分
  used_wavelengths: 0           # 已使用波长数
  wavelength_channels:          # 示例：id=1的波长通道配置
    - wavelength_id: 1
      <<: *wavelength_100g_template
      consistency_id: 1

# 汇聚网链路模板
link_aggregation_template: &link_aggregation_template
  id: 4000
  src: 0
  dst: 0
  type: aggregation
  length_km: 0
  attenuation: 0.22
  dispersion: 17
  osnr: 32                      #dB
  total_wavelengths: 60         # 光纤总波长容量
  fg_otn_support: true          # 支持fgOTN
  oduk_support: true            # 支持ODUk
  wavelength_support: true      # 支持波分
  used_wavelengths: 0           # 已使用波长数
  wavelength_channels:          # 示例：id=1的波长通道配置
    - wavelength_id: 1
      <<: *wavelength_100g_template
      consistency_id: 1

# 省干传输链路模板
link_core_template: &link_core_template
  id: 6000
  src: 0
  dst: 0
  type: core
  length_km: 0
  attenuation: 0.22
  dispersion: 17
  osnr: 30                      #dB
  total_wavelengths: 80         # 光纤总波长容量
  fg_otn_support: false         # 不支持fgOTN
  oduk_support: true            # 支持ODUk
  wavelength_support: true      # 支持波分
  used_wavelengths: 0           # 已使用波长数
  wavelength_channels:          # 示例：id=1的波长通道配置
    - wavelength_id: 1
      <<: *wavelength_100g_template
      consistency_id: 1

