# ======================
# 完整fgOTN仿真架构（光层+电层+fgOTN的粒度）
#ODU0-1.25G、ODU1-2.5G、ODU2-10G、ODU2e-10G、ODU3-40G、ODU4-100G、ODUflex-n*1.25G
#时隙，100G分为1.25G*80个ODU0，一个ODU0包含119*10M（fgTS），一个ODU1包含238*fgTS、一个ODU2包含952*fgTS、n*119fgTS
# ======================


# 接入网OTN节点模板
otn_access_template: &otn_access_template
  id: 0
  name: OTN_ACCESS
  type: access       # 节点类型：access（接入网）、aggregation（汇聚网）、core（省干传输）
  wavelength_num: 40        # 支持40个波长
  add_drop_capability: 10     # 上下路波长数
  fg_otn_support: true       # 支持fgOTN
  oduk_support: true         # 支持ODUk
  wavelength_support: true   # 支持波分
  lat: 0.0
  lon: 0.0

# 汇聚网OTN节点模板
otn_aggregation_template: &otn_aggregation_template
  id: 0
  name: OTN_AGGREGATION
  type: aggregation
  wavelength_num: 60        # 支持60个波长
  add_drop_capability: 15     # 上下路波长数
  fg_otn_support: true       # 支持fgOTN
  oduk_support: true         # 支持ODUk
  wavelength_support: true   # 支持波分

# 省干传输OTN节点模板
otn_core_template: &otn_core_template
  id: 0
  name: OTN_CORE
  type: core
  wavelength_num: 80        # 支持80个波长
  add_drop_capability: 20     # 上下路波长数
  fg_otn_support: false      # 不支持fgOTN
  oduk_support: true         # 支持ODUk
  wavelength_support: true   # 支持波分
  lat: 0.0
  lon: 0.0

# 用户节点模板定义
user_template: &user_template
  id: 0
  name: User

