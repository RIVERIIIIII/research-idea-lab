# NSFNET 拓扑结构（基于 OTN 模板改造）
# 所有节点采用接入网 OTN 节点模板
# 所有链路采用接入网链路模板
# 链路距离 length_km 初始设为 0，由 topology_OTN.py 根据节点坐标计算


# 接入网OTN节点模板
otn_access_template: &otn_access_template
  id: 0
  name: OTN_ACCESS
  type: access
  wavelength_num: 40
  add_drop_capability: 10
  fg_otn_support: true
  oduk_support: true
  wavelength_support: true
  lat: 0.0
  lon: 0.0
  datacenter: 0

# ODU0模板定义
odu0_template: &odu0_template
  odu0_id: 0
  bandwidth: 1.25G
  status: 0
  fg_otn_slots:
    total_slots: 119
    available_slots: 119
    occupied_slots: 0
  support_fg_otn: true

# 100G波长通道模板，status=0表示可用
wavelength_100g_template: &wavelength_100g_template
  wavelength_id: 0
  bandwidth: 100G
  status: 0
  odu0_list:
    - odu0_id: 1
      <<: *odu0_template

# 接入网链路模板
link_access_template: &link_access_template
  id: 2000
  src: 0
  dst: 0
  type: access
  length_km: 0
  attenuation: 0.22
  dispersion: 17
  osnr: 35
  total_wavelengths: 40
  fg_otn_support: true
  oduk_support: true
  wavelength_support: true
  used_wavelengths: 0
  wavelength_channels:
    - wavelength_id: 1  # 波长通道 ID 从 1 开始
      <<: *wavelength_100g_template


